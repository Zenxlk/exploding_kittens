name: exploding_kittens
description: "Exploding Kittens — Mobile game by ZenXLK"
publish_to: 'none'
version: 0.7.3+52

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Estado ──────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── Navegación ──────────────────────────────────────
  go_router: ^17.3.0

  # ── Modelos inmutables ───────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ── Red ─────────────────────────────────────────────
  web_socket_channel: ^3.0.0
  network_info_plus: ^8.2.0
  multicast_dns: ^0.3.2+1
  http: ^1.6.0

  # ── Animaciones ─────────────────────────────────────
  lottie: ^3.5.1
  flutter_animate: ^4.5.0

  # ── Audio ────────────────────────────────────────────
  audioplayers: ^6.1.0

  # ── Persistencia ─────────────────────────────────────
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── Utilidades ───────────────────────────────────────
  equatable: ^2.0.5
  uuid: ^4.5.0
  collection: ^1.18.0
  gap: ^3.0.1

  cupertino_icons: ^1.0.8
  nsd: ^5.0.1
  package_info_plus: ^10.2.0

  # ── Autenticación (Fase 7) ───────────────────────────
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generación de código
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

  # Testing
  mocktail: ^1.0.4
  nsd_platform_interface: ^2.2.0

  flutter_lints: ^6.0.0

  # Ícono de la app
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/cards/
    - assets/sounds/
    - assets/animations/
    - assets/images/
    # .env no versionado (ver .gitignore); si falta, SupabaseConfig.isConfigured
    # da false y la app arranca en modo 100% invitado, sin romper el build.
    - .env

  fonts:
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-Variable.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
